project:
    name: foundryvtt-mediasoup-webrtc
    description: >
        FoundryVTT AVClient that carries core audio/video through a self-hosted
        MediaSoup SFU server. Server-side audio recording for external D&D
        helper applications is a goal, not yet implemented.
    version: 0.7.20
    language: typescript
    framework: none (FoundryVTT module)
    toolchain: vite + bun + biome + vitest
    repository: https://github.com/laurigates/foundryvtt-mediasoup-webrtc
    license: MIT

components:
    - name: client-module
      path: src/
      language: typescript
      description: FoundryVTT ES module built with Vite (bundled to dist/mediasoup-vtt.mjs)
    - name: sfu-server
      path: server/
      language: rust
      description: MediaSoup SFU server with WebSocket signaling
    - name: unit-tests
      path: tests/unit/
      language: typescript
      description: Vitest unit suite with v14-shaped Foundry test doubles (ci.yml)
    - name: sfu-e2e-tests
      path: tests/e2e/sfu/
      language: typescript
      description: Playwright suite running the real bundle on a Foundry stub page against the real SFU (e2e.yml, every PR)
    - name: foundry-e2e-tests
      path: tests/e2e/foundry/
      language: typescript
      description: Playwright suite against a real Foundry server (foundry-e2e.yml, only when Foundry secrets exist; not yet run)


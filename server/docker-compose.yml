version: '3.8'

services:
  mediasoup-server:
    build: .
    ports:
      - "3000:3000"
      - "10000-10100:10000-10100/udp"
      # ICE-TCP fallback for clients behind UDP-blocking firewalls.
      - "10000-10100:10000-10100/tcp"
    environment:
      - MEDIASOUP_LISTEN_ADDR=0.0.0.0:3000
      - MEDIASOUP_NUM_WORKERS=2
      - MEDIASOUP_LOG_LEVEL=warn
      - MEDIASOUP_LOG_TAGS=info,ice,dtls,rtp,rtcp
      - MEDIASOUP_RTC_MIN_PORT=10000
      - MEDIASOUP_RTC_MAX_PORT=10100
      # Shared secret clients must present to connect (see #118). Without it the
      # server runs UNAUTHENTICATED. Set the same value in the module settings.
      - MEDIASOUP_AUTH_TOKEN=${MEDIASOUP_AUTH_TOKEN:-}
      # Optional native TLS (wss://). Point these at mounted PEM files to let the
      # server terminate TLS itself instead of using the nginx reverse proxy.
      # - MEDIASOUP_TLS_CERT=/app/tls/fullchain.pem
      # - MEDIASOUP_TLS_KEY=/app/tls/privkey.pem
      # REQUIRED: the address browsers reach this host on (public IP or DNS
      # name). The server listens on 0.0.0.0 inside the container and refuses to
      # start without it, because it would otherwise advertise an unroutable
      # 0.0.0.0 ICE candidate and no media would flow.
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-}
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    networks:
      - mediasoup-net
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'health check'"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Nginx reverse proxy for SSL termination
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - mediasoup-server
    networks:
      - mediasoup-net
    profiles:
      - reverse-proxy

networks:
  mediasoup-net:
    driver: bridge
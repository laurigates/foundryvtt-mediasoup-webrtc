# MediaSoup SFU for FoundryVTT. See README.md for every variable.
#
#   MEDIASOUP_ANNOUNCED_IP=203.0.113.7 MEDIASOUP_AUTH_TOKEN=change-me \
#     docker compose up --build
services:
  mediasoup-server:
    build: .
    ports:
      # WebSocket signaling.
      - "3000:3000"
      # ICE/RTP media, UDP and the ICE-TCP fallback. Must match
      # MEDIASOUP_RTC_MIN_PORT/MAX_PORT below.
      - "10000-10100:10000-10100/udp"
      - "10000-10100:10000-10100/tcp"
    environment:
      - MEDIASOUP_LISTEN_ADDR=0.0.0.0:3000
      - MEDIASOUP_NUM_WORKERS=2
      - MEDIASOUP_LOG_LEVEL=warn
      - MEDIASOUP_LOG_TAGS=info
      - MEDIASOUP_RTC_MIN_PORT=10000
      - MEDIASOUP_RTC_MAX_PORT=10100
      # The server binds 0.0.0.0 inside the container (MEDIASOUP_LISTEN_IP
      # default), so it needs the address browsers reach the Docker host on
      # (public IP or DNS name). It refuses to start while this is empty,
      # because it would otherwise advertise an unroutable 0.0.0.0 ICE
      # candidate and no media would flow.
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-}
      # Local testing only: start without an announced IP.
      # - MEDIASOUP_ALLOW_UNANNOUNCED=1
      # ICE protocols (defaults shown).
      # - MEDIASOUP_ENABLE_UDP=1
      # - MEDIASOUP_ENABLE_TCP=1
      # - MEDIASOUP_PREFER_UDP=1
      # Shared secret clients must send. Without it the server runs
      # UNAUTHENTICATED. Use the same value in the module settings.
      - MEDIASOUP_AUTH_TOKEN=${MEDIASOUP_AUTH_TOKEN:-}
      # Optional native TLS (wss://): mount PEM files and point these at them,
      # instead of using the nginx profile below.
      # - MEDIASOUP_TLS_CERT=/app/tls/fullchain.pem
      # - MEDIASOUP_TLS_KEY=/app/tls/privkey.pem
      # Server log filter (default info).
      # - RUST_LOG=mediasoup_server=debug
    restart: unless-stopped
    networks:
      - mediasoup-net
    healthcheck:
      # The WebSocket port accepts TCP connections once the server is up.
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  # Optional nginx for TLS termination (`docker compose --profile
  # reverse-proxy up`). Provide your own nginx.conf and ssl/ directory; they
  # are not included. It only needs to proxy the WebSocket port; media goes
  # straight to the RTC ports above.
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - mediasoup-server
    networks:
      - mediasoup-net
    profiles:
      - reverse-proxy

networks:
  mediasoup-net:
    driver: bridge
